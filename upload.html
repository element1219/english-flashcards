<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语背单词 · 上传</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 640px; margin: 0 auto; padding: 20px; line-height: 1.6; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 220px; font-size: 16px; box-sizing: border-box;
             padding: 10px; font-family: Consolas, Menlo, monospace; }
  button { font-size: 16px; padding: 10px 18px; margin: 6px 6px 0 0; cursor: pointer; }
  #log { margin-top: 16px; background: #f4f4f4; border-radius: 8px; padding: 12px;
         font-family: Consolas, Menlo, monospace; font-size: 13px; white-space: pre-wrap; }
  .hint { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>英语背单词 · 内容上传</h1>
<p>每行一个「英文=中文」，例如：</p>
<textarea id="words" placeholder="incredible=不可思议的&#10;intelligent=智慧的&#10;good morning=早上好&#10;I am a student.=我是一名学生。"></textarea>
<p class="hint">提示：旧词保持原顺序不动、新词追加在末尾，孩子的复习进度才不会丢。</p>
<div>
  <button id="btnPush" onclick="doPush()">连接并推送（蓝牙）</button>
  <button onclick="downloadApp()">下载 app.py（备用）</button>
  <button onclick="clearLog()">清空日志</button>
</div>
<div id="log"></div>

<script>
const SERVICE_UUID = '7a5c0001-0000-4000-8000-70617373706f';
const CMD_UUID     = '7a5c0002-0000-4000-8000-70617373706f';
const RSP_UUID     = '7a5c0003-0000-4000-8000-70617373706f';
const APP_NAME = 'english';
const APP_TITLE = 'English';
const CHUNK = 160;

const UI_FLIP = '翻面看答案';
const UI_GOOD = '记得';
const UI_BAD = '忘了';

const TEMPLATE = "\"\"\"English flashcards v2 \u2014 \u53cc\u9762\u5361\uff08\u82f1\u6587 \u2192 \u4e2d\u6587\uff09\u3002\n\n\u5361\u7247\u6d41\u7a0b\uff08\u56de\u5fc6\u95ed\u73af\uff09\uff1a\n  \u6b63\u9762\uff1a\u82f1\u6587\uff08\u5927\u5b57\uff09\u2192 \u5b69\u5b50\u5148\u56de\u5fc6\u4e2d\u6587\u610f\u601d\n  \u6309 OK \u2192 \u7ffb\u9762\uff0c\u663e\u793a\u4e2d\u6587\u91ca\u4e49\n  \u80cc\u9762\uff1aUP = \u8bb0\u5bf9\u4e86\uff08\u5347\u4e00\u7ea7\uff09   DOWN = \u6ca1\u8bb0\u4f4f\uff08\u964d\u56de 0 \u7ea7\uff09   OK = \u7ffb\u56de\u82f1\u6587\u518d\u770b\n  \u957f\u6309 OK = \u9000\u51fa\uff08\u7cfb\u7edf\u884c\u4e3a\uff09\n\n\u95f4\u9694\u590d\u4e60 Leitner [0,1,2,4,7] \u5929\uff0c\u8fdb\u5ea6\u6389\u7535\u4fdd\u5b58\uff08kv\uff09\u3002\nITEMS / FONT_B64 / CP_ORDER / HINT_* \u7531\u751f\u6210\u5668\u586b\u5145\uff08\u4e2d\u6587\u7528 Unicode \u7801\u70b9\u5217\u8868\uff0c\u8bbe\u5907\u7aef\u96f6 UTF-8 \u89e3\u7801\uff09\u3002\n\"\"\"\n\nimport time\nfrom ubinascii import a2b_base64\n\nTITLE = \"English\"\n\n# \u7531\u751f\u6210\u5668\u586b\u5145\nITEMS = __ITEMS__        # [(english, [codepoints...]), ...]\nFONT_B64 = __FONT_B64__  # base64 of 16x16 glyphs (sorted by codepoint)\nCP_ORDER = __CP_ORDER__  # sorted codepoints, aligned with FONT_B64\nHINT_FLIP = __HINT_FLIP__\nHINT_GOOD = __HINT_GOOD__\nHINT_BAD = __HINT_BAD__\n\nGLYPH_W = 16\nGLYPH_H = 16\nGLYPH_BYTES = GLYPH_W * GLYPH_H // 8\nSCALE = 2\nCHAR_W = GLYPH_W * SCALE\n\nBOX_INTERVALS = [0, 1, 2, 4, 7]\nMAX_BOX = len(BOX_INTERVALS) - 1\n\n# ---- \u914d\u8272 (RGB565) ----\nBG = 0x0841\nPANEL = 0x1082\nBAR = 0x18E3\nACCENT = 0x07FF\nFG = 0xFFFF\nDIM = 0x8410\nGOOD = 0x07E0\nBAD = 0xF800\nGOLD = 0x0331\nTYPE_C = {\"WORD\": 0x07FF, \"PHRASE\": 0x07E0, \"SENTENCE\": 0xFD20}\n\n\ndef _type_of(s):\n    s = s.strip()\n    if any(ch in s for ch in \".!?\"):\n        return \"SENTENCE\"\n    if \" \" in s:\n        return \"PHRASE\"\n    return \"WORD\"\n\n\ndef _day_num():\n    t = time.localtime()\n    if t[0] < 2020:\n        return None\n    return t[0] * 372 + t[1] * 31 + t[2]\n\n\ndef _wrap(text, max_chars):\n    words = text.split(\" \")\n    lines = []\n    cur = \"\"\n    for w in words:\n        while len(w) > max_chars:\n            if cur:\n                lines.append(cur)\n                cur = \"\"\n            lines.append(w[:max_chars])\n            w = w[max_chars:]\n        trial = (cur + \" \" + w).strip() if cur else w\n        if len(trial) <= max_chars:\n            cur = trial\n        else:\n            if cur:\n                lines.append(cur)\n            cur = w\n    if cur:\n        lines.append(cur)\n    return lines if lines else [text]\n\n\n# ---- \u72b6\u6001 ----\ndef _load_state(ctx):\n    n = len(ITEMS)\n    boxes = ctx.kv_get(\"boxes\", None)\n    last = ctx.kv_get(\"last\", None)\n    if not isinstance(boxes, list):\n        boxes = []\n    if not isinstance(last, list):\n        last = []\n    ctx.boxes = (boxes + [0] * n)[:n]\n    ctx.last = (last + [0] * n)[:n]\n\n\ndef _save_state(ctx):\n    ctx.kv_set(\"boxes\", ctx.boxes)\n    ctx.kv_set(\"last\", ctx.last)\n    ctx.kv_flush()\n\n\ndef _build_queue(ctx):\n    today = _day_num()\n    q = []\n    for i in range(len(ITEMS)):\n        box = ctx.boxes[i]\n        if today is None:\n            q.append(i)\n        else:\n            last = ctx.last[i]\n            if last == 0 or (today - last) >= BOX_INTERVALS[box]:\n                q.append(i)\n    q.sort(key=lambda i: ctx.boxes[i])\n    return q\n\n\n# ---- \u4e2d\u6587\u70b9\u9635\u6e32\u67d3\uff08\u7801\u70b9\u5217\u8868\uff09----\n_FONT = None\n\n\ndef _font_blob():\n    global _FONT\n    if _FONT is None:\n        _FONT = a2b_base64(FONT_B64)\n    return _FONT\n\n\ndef _glyph(cp):\n    lo, hi = 0, len(CP_ORDER) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        c = CP_ORDER[mid]\n        if c == cp:\n            return _font_blob()[mid * GLYPH_BYTES:(mid + 1) * GLYPH_BYTES]\n        if c < cp:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return None\n\n\ndef _cn_width(cplist):\n    return len(cplist) * CHAR_W\n\n\ndef _draw_glyph(ctx, cp, x, y, color, scale=1):\n    g = _glyph(cp)\n    if g is None:\n        return\n    lcd = ctx.lcd\n    stride = GLYPH_W // 8\n    for row in range(GLYPH_H):\n        base = row * stride\n        col = 0\n        while col < GLYPH_W:\n            if g[base + (col // 8)] & (0x80 >> (col % 8)):\n                run = 1\n                col += 1\n                while col < GLYPH_W and (g[base + (col // 8)] & (0x80 >> (col % 8))):\n                    run += 1\n                    col += 1\n                lcd.fill_rect(x + (col - run) * scale, y + row * scale, run * scale, scale, color)\n            else:\n                col += 1\n\n\ndef _draw_cn_at(ctx, cplist, x, y, color, scale=1):\n    for cp in cplist:\n        _draw_glyph(ctx, cp, x, y, color, scale)\n        x += GLYPH_W * scale\n\n\ndef _draw_cn_center(ctx, cplist, y, color, scale=1):\n    x = (ctx.w - _cn_width(cplist) * scale) // 2\n    if x < 0:\n        x = 0\n    _draw_cn_at(ctx, cplist, x, y, color, scale)\n\n\n# ---- \u7ed8\u5236 ----\ndef _draw_topbar(ctx):\n    lcd = ctx.lcd\n    lcd.fill_rect(0, 0, ctx.w, 22, BAR)\n    lcd.text2x(\"ENGLISH\", 6, 3, ACCENT, BAR)\n    bat = ctx.battery.label()\n    lcd.text(bat, ctx.w - 8 * len(bat) - 4, 7, DIM, BAR)\n    lcd.fill_rect(0, 22, ctx.w, 1, ACCENT)\n\n\ndef _draw_progress(ctx):\n    lcd = ctx.lcd\n    total = ctx.session_total\n    done = ctx.done_count\n    lcd.fill_rect(0, 26, ctx.w, 8, PANEL)\n    if total > 0:\n        pct = (done * 100) // total\n        lcd.progress(0, 26, ctx.w, 8, pct, ACCENT, PANEL)\n    shown = done + 1 if done < total else total\n    lcd.text(\"%d/%d\" % (shown, total), ctx.w - 48, 38, DIM, BG)\n\n\ndef _draw_box_dots(ctx, y):\n    lcd = ctx.lcd\n    i = ctx.queue[0]\n    box = ctx.boxes[i]\n    n = MAX_BOX + 1\n    dw = 12\n    gap = 8\n    total_w = n * dw + (n - 1) * gap\n    x = (ctx.w - total_w) // 2\n    for k in range(n):\n        lcd.fill_rect(x, y, dw, dw, GOLD if k < box else PANEL)\n        x += dw + gap\n\n\ndef _draw_en(ctx, en):\n    lcd = ctx.lcd\n    n = len(en)\n    if n <= 7:\n        scale, max_chars = 4, 7\n    elif n <= 14:\n        scale, max_chars = 3, 10\n    elif n <= 30:\n        scale, max_chars = 2, 15\n    else:\n        scale, max_chars = 1, 30\n    lines = _wrap(en, max_chars)\n    line_h = 8 * scale\n    total_h = line_h * len(lines)\n    y = 92 + (140 - total_h) // 2\n    if y < 92:\n        y = 92\n    for ln in lines:\n        lcd.text_center(ln, y, FG, BG, scale)\n        y += line_h\n\n\ndef _draw_front(ctx):\n    lcd = ctx.lcd\n    lcd.fill(BG)\n    _draw_topbar(ctx)\n    _draw_progress(ctx)\n\n    i = ctx.queue[0]\n    en, cn = ITEMS[i]\n    typ = _type_of(en)\n\n    tc = TYPE_C.get(typ, ACCENT)\n    lcd.fill_rect(8, 46, len(typ) * 8 + 8, 16, tc)\n    lcd.text(typ, 12, 50, BG, tc)\n\n    _draw_en(ctx, en)\n    _draw_box_dots(ctx, 248)\n\n    lcd.fill_rect(0, ctx.h - 24, ctx.w, 24, BAR)\n    lcd.fill_rect(0, ctx.h - 25, ctx.w, 1, ACCENT)\n    lcd.text(\"[OK]\", 6, ctx.h - 18, ACCENT, BAR)\n    _draw_cn_at(ctx, HINT_FLIP, 44, ctx.h - 18, FG, 1)\n\n\ndef _draw_back(ctx):\n    lcd = ctx.lcd\n    lcd.fill(BG)\n    _draw_topbar(ctx)\n    _draw_progress(ctx)\n\n    i = ctx.queue[0]\n    en, cn = ITEMS[i]\n\n    lcd.text_center(\"ANSWER\", 46, DIM, BG, 1)\n    _draw_cn_center(ctx, cn, 128, FG, 2)\n    lcd.text_center(en if len(en) <= 30 else en[:28] + \"..\", 206, DIM, BG, 1)\n\n    lcd.fill_rect(0, ctx.h - 24, ctx.w, 24, BAR)\n    lcd.fill_rect(0, ctx.h - 25, ctx.w, 1, ACCENT)\n    lcd.text(\"[UP]\", 6, ctx.h - 18, GOOD, BAR)\n    _draw_cn_at(ctx, HINT_GOOD, 42, ctx.h - 18, GOOD, 1)\n    lcd.text(\"[DN]\", ctx.w - 78, ctx.h - 18, BAD, BAR)\n    _draw_cn_at(ctx, HINT_BAD, ctx.w - 46, ctx.h - 18, BAD, 1)\n\n\ndef _beep(ctx, freq, ms=60):\n    a = ctx.audio\n    if a is None or not a.ok:\n        return\n    try:\n        if freq:\n            a.tone(freq, ms)\n    except Exception:\n        pass\n\n\ndef _grade(ctx, good):\n    i = ctx.queue[0]\n    today = _day_num()\n    if good:\n        ctx.boxes[i] = min(ctx.boxes[i] + 1, MAX_BOX)\n        ctx.last[i] = today if today is not None else 0\n        _beep(ctx, 1250, 70)\n        ctx.queue.pop(0)\n        ctx.done_count += 1\n    else:\n        ctx.boxes[i] = 0\n        ctx.last[i] = today if today is not None else 0\n        _beep(ctx, 380, 70)\n        ctx.queue.append(ctx.queue.pop(0))\n    _save_state(ctx)\n    if ctx.queue:\n        ctx.state = \"front\"\n        _draw_front(ctx)\n    else:\n        _draw_done(ctx)\n\n\ndef _draw_done(ctx):\n    lcd = ctx.lcd\n    lcd.fill(BG)\n    lcd.text_center(\"DONE!\", 110, GOOD, BG, 3)\n    lcd.text_center(\"%d cards\" % ctx.session_total, 160, FG, BG, 2)\n    lcd.text_center(\"[OK] again\", 220, DIM, BG, 1)\n\n\ndef _draw_clear(ctx):\n    lcd = ctx.lcd\n    lcd.fill(BG)\n    lcd.text_center(\"ALL CLEAR\", 110, GOOD, BG, 3)\n    lcd.text_center(\"no review due\", 160, DIM, BG, 1)\n    lcd.text_center(\"[OK] practice\", 220, FG, BG, 1)\n\n\ndef _begin(ctx, force_all):\n    ctx.queue = list(range(len(ITEMS))) if force_all else _build_queue(ctx)\n    ctx.session_total = len(ctx.queue)\n    ctx.done_count = 0\n    if ctx.queue:\n        ctx.state = \"front\"\n        _draw_front(ctx)\n    else:\n        ctx.state = \"clear\"\n        _draw_clear(ctx)\n\n\ndef setup(ctx):\n    _load_state(ctx)\n    if ctx.audio and ctx.audio.ok:\n        try:\n            ctx.audio.set_volume(75)\n        except Exception:\n            pass\n    _begin(ctx, False)\n\n\ndef on_key(ctx, key):\n    if ctx.state == \"front\":\n        if key == \"ok\":\n            ctx.state = \"back\"\n            _draw_back(ctx)\n    elif ctx.state == \"back\":\n        if key == \"up\":\n            _grade(ctx, True)\n        elif key == \"down\":\n            _grade(ctx, False)\n        elif key == \"ok\":\n            ctx.state = \"front\"\n            _draw_front(ctx)\n    else:\n        if key == \"ok\":\n            _begin(ctx, True)\n        elif key in (\"up\", \"down\"):\n            _begin(ctx, False)\n\n\ndef loop(ctx):\n    pass\n\n\ndef teardown(ctx):\n    _save_state(ctx)\n";

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').textContent = ''; }

function normEn(s) {
  return s.replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/\u2026/g, '...');
}
function codepoints(s) {
  return Array.from(s).map(ch => ch.codePointAt(0));
}

function renderGlyph(ch) {
  const size = 16, big = size * 4;
  const c = document.createElement('canvas');
  c.width = big; c.height = big;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, big, big);
  ctx.fillStyle = '#ffffff';
  ctx.font = Math.floor(big * 0.85) + 'px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ch, big / 2, big / 2);
  const img = ctx.getImageData(0, 0, big, big).data;
  const stride = size >> 3;
  const out = new Uint8Array(size * stride);
  const ratio = big / size;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let sum = 0;
      for (let dy = 0; dy < ratio; dy++) {
        for (let dx = 0; dx < ratio; dx++) {
          sum += img[((y * ratio + dy) * big + (x * ratio + dx)) * 4];
        }
      }
      if (sum / (ratio * ratio) > 128) {
        out[y * stride + (x >> 3)] |= 0x80 >> (x & 7);
      }
    }
  }
  return out;
}

function bytesToBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function buildAppSrc() {
  const lines = document.getElementById('words').value
    .split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
  if (lines.length === 0) { throw new Error('请先输入至少一个词条'); }

  const items = [];
  const cpset = new Set();
  for (const line of lines) {
    const idx = line.indexOf('=');
    let en, cn;
    if (idx >= 0) { en = line.slice(0, idx).trim(); cn = line.slice(idx + 1).trim(); }
    else { en = line.trim(); cn = ''; }
    en = normEn(en);
    const cps = codepoints(cn);
    items.push([en, cps]);
    for (const cp of cps) cpset.add(cp);
  }
  for (const s of [UI_FLIP, UI_GOOD, UI_BAD]) {
    for (const cp of codepoints(s)) cpset.add(cp);
  }

  const cpsSorted = Array.from(cpset).sort((a, b) => a - b);
  const glyphBytes = 32;
  const blob = new Uint8Array(cpsSorted.length * glyphBytes);
  cpsSorted.forEach((cp, i) => {
    blob.set(renderGlyph(String.fromCodePoint(cp)), i * glyphBytes);
  });
  const fontB64 = bytesToBase64(blob);

  let src = TEMPLATE;
  src = src.replace('__ITEMS__', JSON.stringify(items));
  src = src.replace('__FONT_B64__', JSON.stringify(fontB64));
  src = src.replace('__CP_ORDER__', '(' + cpsSorted.join(', ') + ')');
  src = src.replace('__HINT_FLIP__', JSON.stringify(codepoints(UI_FLIP)));
  src = src.replace('__HINT_GOOD__', JSON.stringify(codepoints(UI_GOOD)));
  src = src.replace('__HINT_BAD__', JSON.stringify(codepoints(UI_BAD)));
  return { src, count: items.length, chars: cpset.size };
}

function downloadApp() {
  try {
    const { src } = buildAppSrc();
    const blob = new Blob([src], { type: 'text/x-python' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'app.py';
    a.click();
    URL.revokeObjectURL(a.href);
    log('已生成 app.py 下载');
  } catch (e) { log('错误：' + e.message); }
}

async function doPush() {
  clearLog();
  try {
    if (!navigator.bluetooth) {
      throw new Error('此浏览器不支持 Web Bluetooth，请用 Chrome / Edge（安卓手机用 Chrome）');
    }
    const { src, count, chars } = buildAppSrc();
    const bytes = new TextEncoder().encode(src);
    log('词条：' + count + ' 个，中文字：' + chars + ' 个，app.py：' + bytes.length + ' 字节');

    log('正在扫描设备…（设备需开机、靠近、且不被别的页面占用蓝牙）');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });
    log('已选择设备：' + (device.name || '(未命名)'));
    const server = await device.gatt.connect();
    log('蓝牙已连接');
    const svc = await server.getPrimaryService(SERVICE_UUID);
    const cmd = await svc.getCharacteristic(CMD_UUID);
    const rsp = await svc.getCharacteristic(RSP_UUID);

    const waiters = [];
    let acc = '';
    let frame = '';
    rsp.addEventListener('characteristicvaluechanged', (e) => {
      frame += new TextDecoder().decode(e.target.value);
      while (frame.length > 0) {
        const c = frame[0];
        if (c === '~') { acc += frame.slice(1); frame = ''; }
        else if (c === '!') { acc += frame.slice(1); dispatch(acc); acc = ''; frame = ''; }
        else if (c === '{') {
          const idx = frame.indexOf('}');
          if (idx < 0) return;
          dispatch(frame.slice(0, idx + 1));
          frame = frame.slice(idx + 1);
        } else { frame = frame.slice(1); }
      }
    });
    function dispatch(text) {
      let obj = null;
      try { obj = JSON.parse(text); } catch (e) { return; }
      for (let i = 0; i < waiters.length; i++) {
        if (waiters[i].pred(obj)) { waiters[i].resolve(obj); waiters.splice(i, 1); return; }
      }
    }
    function waitFor(pred, timeout = 30000) {
      return new Promise((resolve, reject) => {
        const w = { pred, resolve };
        waiters.push(w);
        setTimeout(() => {
          const i = waiters.indexOf(w);
          if (i >= 0) { waiters.splice(i, 1); reject(new Error('等待设备响应超时')); }
        }, timeout);
      });
    }
    function sendJson(obj) {
      return cmd.writeValue(new TextEncoder().encode(JSON.stringify(obj)));
    }
    await rsp.startNotifications();

    // 等 MTU 协商稳定（Android 上 Web Bluetooth 可能不主动协商 MTU）
    await new Promise(r => setTimeout(r, 400));

    log('握手…');
    const hello = waitFor(o => o.t === 'hi' || o.t === 'err');
    await sendJson({ t: 'hello' });
    const hi = await hello;
    if (hi.t === 'err') throw new Error('握手失败: ' + hi.m);
    log('设备就绪（OS=' + (hi.os || '?') + '，MTU=' + (hi.mtu || '?') + '）');

    log('开始上传 app.py…');
    const putAck = waitFor(o => o.t === 'put' || o.t === 'err');
    await sendJson({ t: 'put', n: APP_NAME, s: bytes.length, title: APP_TITLE });
    const pr = await putAck;
    if (pr.t === 'err') throw new Error('设备拒绝: ' + pr.m);

    // 分片大小按 MTU 自适应；写失败就减半重试
    let chunk = (hi.mtu && hi.mtu > 23) ? Math.min(240, hi.mtu - 3) : 160;
    let off = 0;
    let finished = false;
    while (off < bytes.length) {
      let slice = bytes.slice(off, off + chunk);
      let wrote = false;
      for (let attempt = 0; attempt < 5 && !wrote; attempt++) {
        try {
          await cmd.writeValue(slice);
          wrote = true;
        } catch (e) {
          if (slice.length <= 20) throw new Error('BLE 写入失败: ' + e.message);
          chunk = Math.max(20, Math.floor(slice.length / 2));
          log('写入被拒，分片降到 ' + chunk + ' 字节重试');
          slice = bytes.slice(off, off + chunk);
        }
      }
      if (!wrote) throw new Error('BLE 写入连续失败');
      const a = await waitFor(o => o.t === 'ack' || o.t === 'done' || o.t === 'err');
      if (a.t === 'err') throw new Error(a.m);
      const got = (typeof a.g === 'number') ? a.g : off + slice.length;
      off = got;
      if (a.t === 'done') { finished = true; break; }
      if (off % 1024 < chunk) log('进度：' + off + '/' + bytes.length);
    }

    if (!finished) {
      const done = waitFor(o => o.t === 'done' || o.t === 'err', 60000);
      await sendJson({ t: 'end' });
      const d = await done;
      if (d.t === 'err' && String(d.m || '').indexOf('没有正在进行') < 0) throw new Error(d.m);
    }
    log('✅ 上传完成！设备端「English」已更新（' + count + ' 个词条）。');

    await sendJson({ t: 'bye' });
    await server.disconnect();
    log('已断开。孩子可在设备菜单打开 English 背单词。');
  } catch (e) {
    log('❌ ' + e.message);
  }
}
</script>
